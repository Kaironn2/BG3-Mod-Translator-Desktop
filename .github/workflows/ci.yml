name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + typecheck + tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Force LF checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: electron-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build bundles (electron-vite)
        run: pnpm exec electron-vite build

      - name: Unit tests
        run: pnpm test

      - name: DB tests (Electron)
        run: pnpm test:db
