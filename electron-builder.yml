appId: com.icosa.bg3-mod-translator
productName: Icosa
buildVersion: 1.17.2
copyright: Copyright © 2026 kaironn
directories:
  buildResources: build
files:
  - package.json
  - out/**
  - drizzle/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,PLANNING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!bkp/**'
asarUnpack:
  - resources/**
  - drizzle/**
  # napi-rs native binding for lz4-napi (pak compression). Its .node lives in a
  # platform-specific package that must sit on the real filesystem - dlopen can't read
  # it from inside app.asar. '**/*.node' also covers any future native dependency.
  - '**/*.node'
  - node_modules/@antoniomuso/**
win:
  executableName: Icosa
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  unicode: true
  packElevateHelper: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  runAfterFinish: false
  deleteAppDataOnUninstall: false
portable:
  requestExecutionLevel: user
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}
publish:
  provider: github
  owner: Kaironn2
  repo: BG3-Mod-Translator-Desktop
npmRebuild: true
